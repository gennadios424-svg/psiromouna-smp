name: PsiromounaSMP
version: 0.1.0
main: com.psiromouna.smp.PsiromounaSMP
api-version: '1.21'
softdepend: [PlaceholderAPI]
commands:
  worth:
    description: Browse item values.
    usage: /worth [search <item>|hand|<item>]
  sell:
    description: Sell items for Lefta.
    usage: /sell [hand|all]
  shop:
    description: Open the Lefta and Shard shops.
    usage: /shop
  ah:
    description: Player auction house.
    usage: /ah [sell <price>|buy <id>|cancel <id>]
  balance:
    description: View your Lefta and Shards.
    aliases: [bal]
    usage: /balance
  currency:
    description: Admin currency management.
    usage: /currency give <player> <lefta|shards> <amount>
permissions:
  psiromouna.admin:
    description: Allows giving Lefta and Shards.
    default: op
