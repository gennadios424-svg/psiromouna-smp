name: PsiromounaSMP
version: 0.3.4
main: com.psiromouna.smp.PsiromounaSMP
api-version: '1.21'
softdepend: [PlaceholderAPI]
commands:
  cmds:
    description: Open the server command menu.
    usage: /cmds
  worth:
    description: Browse item values.
    usage: /worth [search <item>|hand|<item>]
  sell:
    description: Sell items for Euros.
    usage: /sell [hand|all]
  shop:
    description: Open the item shop.
    aliases: [buy]
    usage: /buy
  ah:
    description: Player auction house.
    usage: /ah [sell <price>|buy <id>|cancel <id>]
  balance:
    description: View your Euros and Shards.
    aliases: [bal]
    usage: /balance
  currency:
    description: Admin currency management.
    usage: /currency give <player> <lefta|shards> <amount>
  banner:
    description: Register and manage your personal banner title.
    usage: /banner <title|rename <title>|move|remove>
  afk:
    description: Toggle AFK protection.
    usage: /afk
permissions:
  psiromouna.admin:
    description: Allows giving Lefta and Shards.
    default: op
